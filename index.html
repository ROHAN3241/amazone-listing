<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Breakdown — 3 Easy Steps</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ───── Reset & Base ───── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background-color: #111827;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ───── Subtle Grid Background ───── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ───── Main Container ───── */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 24px;
      max-width: 1100px;
      width: 100%;
    }

    /* ───── Columns Row ───── */
    .columns {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      width: 100%;
      position: relative;
    }

    /* ───── Dashed Connector Line ───── */
    .connector {
      position: absolute;
      top: 50%;
      left: 12%;
      right: 12%;
      height: 0;
      border-top: 2px dashed rgba(255, 255, 255, 0.3);
      transform: translateY(-50%);
      z-index: 0;
    }

    .connector::before,
    .connector::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border: solid rgba(255, 255, 255, 0.3);
      border-width: 0 2px 2px 0;
      transform: translateY(-50%) rotate(-45deg);
    }

    .connector::before {
      left: 33%;
    }

    .connector::after {
      right: 0;
    }

    /* ───── Column Card ───── */
    .column-card {
      flex: 1;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 36px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      z-index: 1;
      margin: 0 20px;

      /* Initial hidden state for animation */
      opacity: 0;
      transform: scale(0.85) translateY(20px);
    }

    .column-card.visible {
      animation: cardReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ───── Step Badge ───── */
    .step-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 20px;
      color: #111827;
    }

    .column-card:nth-child(1) .step-badge { background: #38BDF8; }
    .column-card:nth-child(2) .step-badge { background: #34D399; }
    .column-card:nth-child(3) .step-badge { background: #FBBF24; }

    /* ───── Icon Container ───── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      margin-top: 10px;
      position: relative;
    }

    .column-card:nth-child(1) .icon-wrap { background: rgba(56, 189, 248, 0.12); }
    .column-card:nth-child(2) .icon-wrap { background: rgba(52, 211, 153, 0.12); }
    .column-card:nth-child(3) .icon-wrap { background: rgba(251, 191, 36, 0.12); }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }

    /* ───── Percentage ───── */
    .percentage {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .column-card:nth-child(1) .percentage { color: #38BDF8; }
    .column-card:nth-child(2) .percentage { color: #34D399; }
    .column-card:nth-child(3) .percentage { color: #FBBF24; }

    /* ───── Label ───── */
    .label {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }

    /* ───── Progress Bar (Column 2) ───── */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #34D399, #6EE7B7);
      position: relative;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6EE7B7;
      box-shadow: 0 0 12px #34D399, 0 0 24px rgba(52, 211, 153, 0.4);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .progress-fill.animate::after {
      opacity: 1;
    }

    .progress-fill.animate {
      width: 100%;
    }

    /* ───── Truck Animation (Column 3) ───── */
    .truck-scene {
      width: 100%;
      height: 36px;
      position: relative;
      overflow: hidden;
    }

    .truck-icon {
      position: absolute;
      left: -50px;
      top: 4px;
      transition: left 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .truck-icon.animate {
      left: calc(50% - 18px);
    }

    .truck-icon svg {
      width: 36px;
      height: 28px;
    }

    .box-icon {
      position: absolute;
      left: calc(50% + 24px);
      top: -20px;
      opacity: 0;
    }

    .box-icon.animate {
      animation: boxBounce 0.6s 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes boxBounce {
      0% {
        top: -20px;
        opacity: 0;
      }
      60% {
        top: 10px;
        opacity: 1;
      }
      80% {
        top: 4px;
      }
      100% {
        top: 8px;
        opacity: 1;
      }
    }

    .box-icon svg {
      width: 20px;
      height: 20px;
    }

    /* ───── Wallet Fill Animation (Column 1) ───── */
    .wallet-fill {
      clip-path: inset(100% 0 0 0);
      transition: clip-path 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .wallet-fill.animate {
      clip-path: inset(0 0 0 0);
    }

    /* ───── Sparkle (Column 2) ───── */
    .sparkle {
      position: absolute;
      top: 4px;
      right: 4px;
      opacity: 0;
    }

    .sparkle.animate {
      animation: sparklePulse 1.5s ease-in-out infinite;
    }

    @keyframes sparklePulse {
      0%, 100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(20deg); }
    }

    /* ───── Counter Bounce ───── */
    @keyframes counterBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .percentage.bounce {
      animation: counterBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ───── Bottom Text ───── */
    .bottom-text {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s, transform 0.6s;
    }

    .bottom-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-text span {
      background: linear-gradient(90deg, #38BDF8, #34D399, #FBBF24);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ───── Responsive ───── */
    @media (max-width: 768px) {
      .columns {
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .connector {
        display: none;
      }

      .column-card {
        margin: 0;
        max-width: 340px;
        width: 100%;
      }

      .percentage {
        font-size: 40px;
      }

      .bottom-text {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="columns">
      <!-- Dashed Connector -->
      <div class="connector"></div>

      <!-- Column 1 — Booking Amount -->
      <div class="column-card" data-delay="0">
        <div class="step-badge">Step 1</div>
        <div class="icon-wrap">
          <!-- Wallet Icon -->
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="8" width="30" height="22" rx="4" stroke="#38BDF8" stroke-width="2" fill="none" />
            <path d="M3 14h30" stroke="#38BDF8" stroke-width="2" />
            <rect class="wallet-fill" x="3" y="14" width="30" height="16" rx="0" fill="rgba(56,189,248,0.18)" />
            <circle cx="26" cy="22" r="2.5" fill="#38BDF8" />
            <path d="M10 8V6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2" stroke="#38BDF8" stroke-width="2" fill="none" />
          </svg>
        </div>
        <div class="percentage" data-target="10" id="counter1">0%</div>
        <div class="label">Booking Amount</div>
      </div>

      <!-- Column 2 — Training Complete -->
      <div class="column-card" data-delay="300">
        <div class="step-badge">Step 2</div>
        <div class="icon-wrap">
          <!-- Graduation Cap Icon -->
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="18,4 2,14 18,24 34,14" stroke="#34D399" stroke-width="2" fill="rgba(52,211,153,0.15)" />
            <polyline points="28,17 28,28 18,32 8,28 8,17" stroke="#34D399" stroke-width="2" fill="none" />
            <line x1="34" y1="14" x2="34" y2="28" stroke="#34D399" stroke-width="2" />
            <circle cx="34" cy="29" r="1.5" fill="#34D399" />
          </svg>
          <!-- Sparkle -->
          <svg class="sparkle" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 0l1.8 5.2L16 8l-6.2 1.8L8 16l-1.8-6.2L0 8l6.2-1.8z" fill="#34D399" />
          </svg>
        </div>
        <div class="percentage" data-target="40" id="counter2">0%</div>
        <div class="label">Training Complete hone par</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Column 3 — Material Dispatch -->
      <div class="column-card" data-delay="600">
        <div class="step-badge">Step 3</div>
        <div class="icon-wrap">
          <!-- Delivery Truck Icon -->
          <svg viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="4" width="20" height="16" rx="2" stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.12)" />
            <path d="M21 10h6l5 6v4h-11V10z" stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.08)" />
            <circle cx="8" cy="22" r="3" stroke="#FBBF24" stroke-width="2" fill="#111827" />
            <circle cx="27" cy="22" r="3" stroke="#FBBF24" stroke-width="2" fill="#111827" />
            <circle cx="8" cy="22" r="1" fill="#FBBF24" />
            <circle cx="27" cy="22" r="1" fill="#FBBF24" />
          </svg>
        </div>
        <div class="percentage" data-target="50" id="counter3">0%</div>
        <div class="label">Material Dispatch ke time</div>
        <div class="truck-scene">
          <div class="truck-icon" id="truckIcon">
            <svg viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="4" width="20" height="16" rx="2" stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.15)" />
              <path d="M21 10h6l5 6v4h-11V10z" stroke="#FBBF24" stroke-width="2" fill="rgba(251,191,36,0.1)" />
              <circle cx="8" cy="22" r="3" stroke="#FBBF24" stroke-width="2" fill="#111827" />
              <circle cx="27" cy="22" r="3" stroke="#FBBF24" stroke-width="2" fill="#111827" />
            </svg>
          </div>
          <div class="box-icon" id="boxIcon">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="6" width="16" height="12" rx="1.5" stroke="#FBBF24" stroke-width="1.5" fill="rgba(251,191,36,0.18)" />
              <path d="M2 6l8-4 8 4" stroke="#FBBF24" stroke-width="1.5" fill="none" />
              <line x1="10" y1="2" x2="10" y2="18" stroke="#FBBF24" stroke-width="1" opacity="0.4" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Text -->
    <div class="bottom-text" id="bottomText">
      One Time Payment Nahi — <span>3 Easy Steps!</span>
    </div>
  </div>

  <script>
    "use strict";

    /* ───── Counter Animation ───── */
    function animateCounter(element, target, duration, onComplete) {
      const start = performance.now();
      function tick(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        /* Ease-out cubic */
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = Math.round(eased * target);
        element.textContent = value + "%";
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          element.textContent = target + "%";
          /* Bounce at the end */
          element.classList.add("bounce");
          element.addEventListener("animationend", function handler() {
            element.classList.remove("bounce");
            element.removeEventListener("animationend", handler);
          });
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(tick);
    }

    /* ───── Staggered Reveal ───── */
    function startAnimation() {
      const cards = document.querySelectorAll(".column-card");

      cards.forEach(function (card) {
        const delay = parseInt(card.dataset.delay, 10) || 0;
        setTimeout(function () {
          card.classList.add("visible");

          /* Trigger card-specific animations after reveal */
          const revealDuration = 600; /* match CSS animation duration */
          setTimeout(function () {
            triggerCardAnimation(card);
          }, revealDuration * 0.5);
        }, delay);
      });

      /* Show bottom text after all columns are visible */
      var totalDelay = 600 + 600 + 400; /* last card delay + reveal + buffer */
      setTimeout(function () {
        document.getElementById("bottomText").classList.add("visible");
      }, totalDelay);
    }

    function triggerCardAnimation(card) {
      var index = Array.from(card.parentElement.children).indexOf(card) - 1; /* -1 for connector */

      switch (index) {
        case 0:
          /* Column 1: wallet fill + counter */
          var walletFill = card.querySelector(".wallet-fill");
          if (walletFill) walletFill.classList.add("animate");
          animateCounter(document.getElementById("counter1"), 10, 800);
          break;

        case 1:
          /* Column 2: sparkle + counter + progress bar */
          var sparkle = card.querySelector(".sparkle");
          if (sparkle) sparkle.classList.add("animate");
          animateCounter(document.getElementById("counter2"), 40, 1000);
          var progressFill = document.getElementById("progressFill");
          setTimeout(function () {
            progressFill.classList.add("animate");
          }, 200);
          break;

        case 2:
          /* Column 3: truck + box + counter */
          animateCounter(document.getElementById("counter3"), 50, 1000);
          var truck = document.getElementById("truckIcon");
          var box = document.getElementById("boxIcon");
          truck.classList.add("animate");
          box.classList.add("animate");
          break;
      }
    }

    /* ───── Launch on Load ───── */
    window.addEventListener("DOMContentLoaded", function () {
      /* Small initial delay for page render */
      setTimeout(startAnimation, 400);
    });
  </script>
</body>
</html>
