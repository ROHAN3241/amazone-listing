<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 1 – Sign the Franchise Agreement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ─── 16:9 Stage ────────────────────────────────────────────────────── */
    #stage {
      position: relative;
      width: 1920px; height: 1080px;
      transform-origin: top left;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* ─── Background ────────────────────────────────────────────────────── */
    #bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 60%, #1a2d4a 0%, #0a1628 70%);
    }

    /* ─── Ambient Light Rays ─────────────────────────────────────────────── */
    #rays {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .ray {
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 700px;
      background: linear-gradient(to top, transparent, rgba(212,175,55,0.10), transparent);
      transform-origin: bottom center;
      animation: rayPulse 4s ease-in-out infinite alternate;
      border-radius: 2px;
    }
    .ray:nth-child(1)  { transform: translateX(-50%) rotate(-60deg);  animation-delay: 0s;   }
    .ray:nth-child(2)  { transform: translateX(-50%) rotate(-45deg);  animation-delay: 0.3s; }
    .ray:nth-child(3)  { transform: translateX(-50%) rotate(-30deg);  animation-delay: 0.6s; }
    .ray:nth-child(4)  { transform: translateX(-50%) rotate(-15deg);  animation-delay: 0.9s; }
    .ray:nth-child(5)  { transform: translateX(-50%) rotate(0deg);    animation-delay: 1.2s; }
    .ray:nth-child(6)  { transform: translateX(-50%) rotate(15deg);   animation-delay: 0.9s; }
    .ray:nth-child(7)  { transform: translateX(-50%) rotate(30deg);   animation-delay: 0.6s; }
    .ray:nth-child(8)  { transform: translateX(-50%) rotate(45deg);   animation-delay: 0.3s; }
    .ray:nth-child(9)  { transform: translateX(-50%) rotate(60deg);   animation-delay: 0s;   }

    @keyframes rayPulse {
      from { opacity: 0.3; }
      to   { opacity: 1;   }
    }

    /* ─── Document ───────────────────────────────────────────────────────── */
    #document-wrap {
      position: absolute;
      left: 50%; top: 50%;
      width: 520px; height: 660px;
      transform: translate(-50%, 130%);
      animation: docSlideIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }
    @keyframes docSlideIn {
      to { transform: translate(-50%, -55%); }
    }

    #document {
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 2px solid #d4af37;
      border-radius: 14px;
      box-shadow:
        0 0 60px rgba(212,175,55,0.18),
        0 30px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.12);
      padding: 40px 48px 36px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* embossed logo area */
    #logo-area {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(212,175,55,0.4);
      padding-bottom: 20px;
    }
    #logo-emblem {
      width: 72px; height: 72px;
      border: 2.5px solid #d4af37;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 40% 35%, rgba(212,175,55,0.25), rgba(212,175,55,0.05));
      box-shadow: 0 0 22px rgba(212,175,55,0.4), inset 0 0 12px rgba(212,175,55,0.15);
    }
    #logo-emblem svg { width: 38px; height: 38px; }
    #doc-title {
      font-size: 20px; font-weight: 700;
      color: #d4af37;
      letter-spacing: 2px; text-transform: uppercase;
      text-shadow: 0 0 16px rgba(212,175,55,0.5);
    }
    #doc-subtitle {
      font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 1.5px; text-transform: uppercase;
    }

    /* body lines */
    .doc-line {
      height: 10px; border-radius: 4px;
      background: rgba(255,255,255,0.10);
    }
    .doc-line.short  { width: 60%; }
    .doc-line.medium { width: 80%; }
    .doc-line.full   { width: 100%; }

    /* signature area */
    #sig-area {
      margin-top: auto;
      border-top: 1px solid rgba(212,175,55,0.35);
      padding-top: 16px;
    }
    #sig-label {
      font-size: 10px; color: rgba(255,255,255,0.45);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    #sig-line-row {
      display: flex; align-items: flex-end; gap: 0;
    }
    #sig-canvas-wrap {
      flex: 1; height: 56px; position: relative;
      border-bottom: 1.5px solid rgba(212,175,55,0.5);
    }
    #sig-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    /* ─── Hand + Pen silhouette ──────────────────────────────────────────── */
    #hand-wrap {
      position: absolute;
      /* will be positioned relative to stage by JS */
      pointer-events: none;
      opacity: 0;
      animation: handEnter 0.6s ease-out 1.7s forwards;
    }
    @keyframes handEnter {
      from { opacity: 0; transform: translate(80px, 30px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }
    #hand-svg {
      width: 200px; height: auto;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,0.7));
    }

    /* ─── Checkmark ──────────────────────────────────────────────────────── */
    #checkmark-wrap {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -80px);
      opacity: 0;
      pointer-events: none;
    }
    #checkmark-wrap.show {
      animation: checkAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes checkAppear {
      from { opacity: 0; transform: translate(-50%, -80px) scale(0.3); }
      to   { opacity: 1; transform: translate(-50%, -80px) scale(1); }
    }
    #check-svg {
      width: 110px; height: 110px;
      filter: drop-shadow(0 0 24px rgba(212,175,55,0.9)) drop-shadow(0 0 60px rgba(212,175,55,0.4));
    }
    #check-path {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
    }
    #check-path.draw {
      animation: drawCheck 0.5s ease-out forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }
    #check-circle {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }
    #check-circle.draw {
      animation: drawCircle 0.5s ease-out forwards;
    }
    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }

    /* ─── Particles ──────────────────────────────────────────────────────── */
    .particle {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #d4af37;
      pointer-events: none;
      opacity: 0;
    }

    /* ─── Text Overlay ───────────────────────────────────────────────────── */
    #text-overlay {
      position: absolute;
      bottom: 88px; left: 50%;
      transform: translateX(-50%);
      font-size: 38px; font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 1px;
      text-shadow:
        0 0 30px rgba(212,175,55,0.6),
        0 2px 8px rgba(0,0,0,0.8);
      opacity: 0;
    }
    #text-overlay.visible { opacity: 1; }

    /* ─── Gold corner accents ────────────────────────────────────────────── */
    .corner {
      position: absolute;
      width: 36px; height: 36px;
      border-color: rgba(212,175,55,0.55);
      border-style: solid;
      pointer-events: none;
    }
    .corner.tl { top: 28px; left: 28px;   border-width: 2px 0 0 2px; }
    .corner.tr { top: 28px; right: 28px;  border-width: 2px 2px 0 0; }
    .corner.bl { bottom: 28px; left: 28px;  border-width: 0 0 2px 2px; }
    .corner.br { bottom: 28px; right: 28px; border-width: 0 2px 2px 0; }
  </style>
</head>
<body>
<div id="stage">

  <!-- Background -->
  <div id="bg"></div>

  <!-- Ambient rays -->
  <div id="rays">
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
    <div class="ray"></div><div class="ray"></div><div class="ray"></div>
  </div>

  <!-- Corner accents -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Document -->
  <div id="document-wrap">
    <div id="document">

      <!-- Embossed logo -->
      <div id="logo-area">
        <div id="logo-emblem">
          <!-- crown / franchise icon -->
          <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 28 L9 14 L14 22 L19 8 L24 22 L29 14 L33 28 Z" fill="#d4af37" opacity="0.85"/>
            <rect x="5" y="28" width="28" height="3" rx="1.5" fill="#d4af37"/>
          </svg>
        </div>
        <div id="doc-title">Franchise Agreement</div>
        <div id="doc-subtitle">Official Partnership Document</div>
      </div>

      <!-- Body lines (placeholder text) -->
      <div class="doc-line full"></div>
      <div class="doc-line medium"></div>
      <div class="doc-line full"></div>
      <div class="doc-line short"></div>
      <div class="doc-line full"></div>
      <div class="doc-line medium"></div>
      <div class="doc-line full"></div>
      <div class="doc-line short"></div>
      <div class="doc-line medium"></div>

      <!-- Signature area -->
      <div id="sig-area">
        <div id="sig-label">Authorized Signature</div>
        <div id="sig-line-row">
          <div id="sig-canvas-wrap">
            <canvas id="sig-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hand / pen -->
  <div id="hand-wrap">
    <svg id="hand-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <!-- pen body -->
      <g transform="rotate(-38, 60, 80)">
        <!-- barrel -->
        <rect x="52" y="20" width="18" height="100" rx="5" fill="#1a2d4a" stroke="#d4af37" stroke-width="1.5"/>
        <!-- gold clip -->
        <rect x="67" y="24" width="4" height="70" rx="2" fill="#d4af37"/>
        <!-- cap gradient top -->
        <rect x="52" y="20" width="18" height="22" rx="5" fill="#d4af37"/>
        <!-- nib -->
        <polygon points="52,120 70,120 61,142" fill="#d4af37"/>
        <!-- nib highlight -->
        <polygon points="55,120 61,120 61,136" fill="rgba(255,255,255,0.3)"/>
      </g>
      <!-- hand silhouette – simple stylised hand -->
      <path d="
        M 10,155
        C 10,130 18,110 30,100
        C 38,94 46,92 52,95
        L 58,100
        C 64,96 70,94 76,97
        C 82,100 84,108 80,118
        C 90,114 100,114 104,120
        C 108,126 106,135 98,140
        L 80,150
        C 72,155 52,160 36,160
        C 20,160 10,165 10,155 Z
      " fill="#0d1e35" stroke="#1e3a5a" stroke-width="1.5"/>
      <!-- fingers highlight -->
      <path d="M 58,100 C 62,88 68,82 72,85 C 76,88 76,98 72,108"
            fill="none" stroke="#1e3a5a" stroke-width="2" stroke-linecap="round"/>
      <path d="M 76,97 C 80,86 86,80 90,83 C 94,86 93,97 89,108"
            fill="none" stroke="#1e3a5a" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Checkmark -->
  <div id="checkmark-wrap">
    <svg id="check-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
      <circle id="check-circle" cx="55" cy="55" r="50"
              fill="none" stroke="#d4af37" stroke-width="3"
              stroke-linecap="round"/>
      <path id="check-path" d="M 28 55 L 46 74 L 82 34"
            fill="none" stroke="#d4af37" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Text Overlay -->
  <div id="text-overlay"></div>

  <!-- Particles container -->
  <div id="particles"></div>

</div>

<script>
/* ─── Stage Scale ─────────────────────────────────────────────────────────── */
(function scaleStage() {
  const stage = document.getElementById('stage');
  function resize() {
    const scaleX = window.innerWidth  / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale  = Math.min(scaleX, scaleY);
    stage.style.transform = `scale(${scale})`;
    const offsetX = (window.innerWidth  - 1920 * scale) / 2;
    const offsetY = (window.innerHeight - 1080 * scale) / 2;
    stage.style.left = offsetX + 'px';
    stage.style.top  = offsetY + 'px';
    stage.style.position = 'absolute';
  }
  resize();
  window.addEventListener('resize', resize);
})();

/* ─── Constants ──────────────────────────────────────────────────────────── */
const PARTICLE_COUNT = 24;

/* ─── Helpers ─────────────────────────────────────────────────────────────── */
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

/* ─── Signature Canvas ────────────────────────────────────────────────────── */
const sigCanvas = document.getElementById('sig-canvas');
const sigCtx    = sigCanvas.getContext('2d');

function initCanvas() {
  const wrap = document.getElementById('sig-canvas-wrap');
  sigCanvas.width  = wrap.offsetWidth;
  sigCanvas.height = wrap.offsetHeight;
}
initCanvas();

/* Signature bezier points (relative to canvas size) */
const sigPoints = [
  [0.04, 0.75], [0.10, 0.25], [0.16, 0.80], [0.22, 0.35],
  [0.28, 0.70], [0.34, 0.20], [0.40, 0.80], [0.48, 0.45],
  [0.55, 0.30], [0.62, 0.65], [0.68, 0.25], [0.74, 0.60],
  [0.80, 0.40], [0.86, 0.55], [0.92, 0.35], [0.97, 0.50]
];

let sigProgress = 0; // 0–1
let sigAnimId   = null;

function drawSignature(progress) {
  const W = sigCanvas.width;
  const H = sigCanvas.height;
  sigCtx.clearRect(0, 0, W, H);

  const pts = sigPoints.map(([rx, ry]) => [rx * W, ry * H]);
  const total = pts.length - 1;
  const drawn = progress * total;

  sigCtx.beginPath();
  sigCtx.strokeStyle = '#d4af37';
  sigCtx.lineWidth   = 2.5;
  sigCtx.lineCap     = 'round';
  sigCtx.lineJoin    = 'round';
  sigCtx.shadowColor = 'rgba(212,175,55,0.8)';
  sigCtx.shadowBlur  = 8;

  sigCtx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < drawn; i++) {
    const idx = Math.floor(i);
    if (idx + 1 >= pts.length) break;
    const frac = Math.min(drawn - idx, 1);
    const x = pts[idx][0] + (pts[idx+1][0] - pts[idx][0]) * frac;
    const y = pts[idx][1] + (pts[idx+1][1] - pts[idx][1]) * frac;
    sigCtx.lineTo(x, y);
  }
  sigCtx.stroke();
}

function animateSignature(startTime, duration, callback) {
  function step(ts) {
    const elapsed = ts - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = easeInOut(t);
    drawSignature(ease);
    if (t < 1) {
      sigAnimId = requestAnimationFrame(step);
    } else {
      if (callback) callback();
    }
  }
  sigAnimId = requestAnimationFrame(step);
}

/* ─── Hand Positioning ─────────────────────────────────────────────────────── */
function positionHand(progress) {
  const wrap    = document.getElementById('hand-wrap');
  const docWrap = document.getElementById('document-wrap');
  const sigWrap = document.getElementById('sig-canvas-wrap');

  // Get sig canvas bounding rect relative to stage
  const stageEl   = document.getElementById('stage');
  const stageRect = stageEl.getBoundingClientRect();
  const sigRect   = sigWrap.getBoundingClientRect();
  const scale     = stageRect.width / 1920;

  // Convert to stage coordinates
  const sigX = (sigRect.left - stageRect.left) / scale;
  const sigY = (sigRect.top  - stageRect.top)  / scale;
  const sigW = sigRect.width  / scale;
  const sigH = sigRect.height / scale;

  // Pen tip is roughly at (61*cos(-38°)-38*sin(-38°), 142*cos(-38°)) within svg
  // We'll offset the hand so the nib tracks the signature progress
  const pts = sigPoints;
  const idx = Math.floor(progress * (pts.length - 1));
  const safIdx = Math.min(idx, pts.length - 2);
  const frac   = progress * (pts.length - 1) - safIdx;
  const rx     = pts[safIdx][0] + (pts[safIdx+1][0] - pts[safIdx][0]) * frac;
  const ry     = pts[safIdx][1] + (pts[safIdx+1][1] - pts[safIdx][1]) * frac;

  const penX = sigX + rx * sigW - 58;   // nib offset in SVG
  const penY = sigY + ry * sigH - 135;

  wrap.style.left = penX + 'px';
  wrap.style.top  = penY + 'px';
}

/* ─── Particles ───────────────────────────────────────────────────────────── */
function burstParticles(cx, cy) {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const count = PARTICLE_COUNT;
  for (let i = 0; i < count; i++) {
    const p  = document.createElement('div');
    p.className = 'particle';
    const angle  = (i / count) * Math.PI * 2;
    const radius = 80 + Math.random() * 80;
    const tx = Math.cos(angle) * radius;
    const ty = Math.sin(angle) * radius;
    const size = 4 + Math.random() * 6;
    p.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${cx}px; top: ${cy}px;
      transform: translate(-50%, -50%);
      opacity: 0;
    `;
    container.appendChild(p);

    const delay = Math.random() * 120;
    setTimeout(() => {
      p.style.transition = 'transform 0.8s cubic-bezier(0.2,0,0.4,1), opacity 0.8s ease';
      p.style.transform  = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
      p.style.opacity    = '1';
      setTimeout(() => {
        p.style.opacity = '0';
      }, 500);
    }, delay);
  }
}

/* ─── Typewriter ─────────────────────────────────────────────────────────── */
function typewriter(el, text, speed, callback) {
  el.style.opacity = '1';
  let i = 0;
  function type() {
    if (i <= text.length) {
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, speed);
    } else {
      if (callback) callback();
    }
  }
  type();
}

/* ─── Master Timeline ─────────────────────────────────────────────────────── */
function runTimeline() {
  // Reset state
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  document.getElementById('text-overlay').textContent = '';
  document.getElementById('text-overlay').style.opacity = '0';
  document.getElementById('checkmark-wrap').classList.remove('show');
  document.getElementById('check-path').classList.remove('draw');
  document.getElementById('check-circle').classList.remove('draw');
  document.getElementById('checkmark-wrap').style.opacity = '0';
  document.getElementById('hand-wrap').style.opacity = '0';
  document.getElementById('hand-wrap').style.animation = 'none';

  // Reset document animation
  const docWrap = document.getElementById('document-wrap');
  docWrap.style.animation = 'none';
  docWrap.style.transform = 'translate(-50%, 130%)';

  // Force reflow
  void docWrap.offsetWidth;

  // 0.4 s – doc slides in (CSS animation)
  docWrap.style.animation = 'docSlideIn 1s cubic-bezier(0.22,1,0.36,1) 0.4s forwards';

  // 1.6 s – hand enters (CSS animation)
  const handWrap = document.getElementById('hand-wrap');
  handWrap.style.animation = 'none';
  void handWrap.offsetWidth;

  // Position hand at start
  positionHand(0);
  handWrap.style.animation = 'handEnter 0.6s ease-out 1.7s forwards';

  // 2.0 s – start signature drawing
  setTimeout(() => {
    const sigDuration = 2000; // 2 seconds to sign
    let startTs = null;

    function sigStep(ts) {
      if (!startTs) startTs = ts;
      const elapsed = ts - startTs;
      const progress = Math.min(elapsed / sigDuration, 1);
      const ease = easeInOut(progress);

      drawSignature(ease);
      positionHand(ease);

      if (progress < 1) {
        requestAnimationFrame(sigStep);
      } else {
        onSignatureComplete();
      }
    }
    requestAnimationFrame(sigStep);
  }, 2100);
}

function onSignatureComplete() {
  // Hide hand
  const handWrap = document.getElementById('hand-wrap');
  handWrap.style.transition = 'opacity 0.4s ease';
  handWrap.style.opacity    = '0';

  // Show checkmark
  setTimeout(() => {
    const cWrap = document.getElementById('checkmark-wrap');
    const cPath = document.getElementById('check-path');
    const cCirc = document.getElementById('check-circle');

    // Compute center of checkmark on stage
    const stageEl   = document.getElementById('stage');
    const stageRect = stageEl.getBoundingClientRect();
    const scale     = stageRect.width / 1920;
    const cRect     = cWrap.getBoundingClientRect();
    const cx = (cRect.left + cRect.width  / 2 - stageRect.left) / scale;
    const cy = (cRect.top  + cRect.height / 2 - stageRect.top)  / scale;

    cWrap.classList.add('show');
    setTimeout(() => { cCirc.classList.add('draw'); }, 50);
    setTimeout(() => { cPath.classList.add('draw'); }, 300);

    // Particle burst
    setTimeout(() => burstParticles(cx, cy), 200);

    // Typewriter text
    setTimeout(() => {
      const textEl = document.getElementById('text-overlay');
      typewriter(textEl, 'Step 1: Sign the Franchise Agreement', 55, () => {
        // Schedule loop restart after pause
        setTimeout(restartLoop, 1800);
      });
    }, 600);
  }, 200);
}

function restartLoop() {
  // Fade out & restart
  const stage = document.getElementById('stage');
  stage.style.transition = 'opacity 0.5s ease';
  stage.style.opacity = '0';
  setTimeout(() => {
    // Reset checkmark draw
    const cPath = document.getElementById('check-path');
    const cCirc = document.getElementById('check-circle');
    cPath.classList.remove('draw');
    cCirc.classList.remove('draw');
    // Reset text
    document.getElementById('text-overlay').textContent = '';
    document.getElementById('text-overlay').style.opacity = '0';
    // Reset canvas
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);

    stage.style.opacity = '1';
    stage.style.transition = 'opacity 0.5s ease';
    runTimeline();
  }, 600);
}

/* ─── Boot ────────────────────────────────────────────────────────────────── */
window.addEventListener('load', () => {
  // Small delay to ensure fonts loaded
  setTimeout(runTimeline, 200);
});
</script>
</body>
</html>
