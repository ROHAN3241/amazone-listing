<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franchise Agreement Signing — Premium Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* 16:9 letterbox wrapper */
    #stage {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      overflow: hidden;
      background: linear-gradient(135deg, #0a1628 0%, #1a2d4a 100%);
    }

    /* ── BACKGROUND LAYER ── */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── AMBIENT GLOW ── */
    #ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%,
        rgba(212,175,55,0.08) 0%,
        rgba(212,175,55,0.03) 40%,
        transparent 70%);
      opacity: 0;
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 0.9; transform: scale(1.06); }
    }

    /* ── LIGHT RAYS ── */
    #rays {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: raysIn 1s 0.2s ease-out forwards;
    }
    @keyframes raysIn { to { opacity: 1; } }

    .ray {
      position: absolute;
      width: 2px;
      background: linear-gradient(to top,
        rgba(212,175,55,0) 0%,
        rgba(212,175,55,0.18) 50%,
        rgba(212,175,55,0) 100%);
      transform-origin: center bottom;
      border-radius: 2px;
      animation: rayPulse 4s ease-in-out infinite;
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* ── DOCUMENT ── */
    #document-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 120%) scale(0.9);
      opacity: 0;
      animation: docSlideIn 0.9s 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      width: 36%;
      max-width: 560px;
    }
    @keyframes docSlideIn {
      to { transform: translate(-50%, -52%); opacity: 1; }
    }

    #document {
      position: relative;
      background: rgba(26, 45, 74, 0.55);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 2px solid rgba(212,175,55,0.75);
      border-radius: 12px;
      padding: 5% 6%;
      box-shadow:
        0 0 0 1px rgba(212,175,55,0.15),
        0 8px 40px rgba(0,0,0,0.55),
        0 0 60px rgba(212,175,55,0.12),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Corner ornaments */
    #document::before,
    #document::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #d4af37;
      border-style: solid;
    }
    #document::before { top: 6px; left: 6px; border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    #document::after  { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    /* Logo emboss area */
    .doc-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6%;
    }
    .doc-logo-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(212,175,55,0.55), rgba(212,175,55,0.15));
      border: 1.5px solid rgba(212,175,55,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(212,175,55,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .doc-logo-inner {
      font-size: 18px;
      color: #d4af37;
      font-weight: 700;
      letter-spacing: -1px;
      text-shadow: 0 0 8px rgba(212,175,55,0.7);
    }
    .doc-title {
      margin-left: 10px;
      font-size: clamp(7px, 1.1vw, 13px);
      color: #d4af37;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow: 0 0 8px rgba(212,175,55,0.5);
    }

    /* Text lines */
    .doc-lines { margin-bottom: 5%; }
    .doc-line {
      height: 5px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.08) 80%,
        transparent 100%);
      border-radius: 3px;
      margin-bottom: 6px;
    }
    .doc-line:nth-child(3) { width: 75%; }
    .doc-line:nth-child(5) { width: 85%; }
    .doc-line:nth-child(6) { width: 60%; }

    /* Signature zone */
    .sig-zone {
      margin-top: 4%;
      padding-top: 3%;
      border-top: 1px solid rgba(212,175,55,0.4);
      position: relative;
    }
    .sig-label {
      font-size: clamp(6px, 0.85vw, 10px);
      color: rgba(212,175,55,0.7);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .sig-line-container {
      position: relative;
      height: 36px;
      overflow: visible;
    }
    .sig-baseline {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(212,175,55,0.35);
    }

    /* SVG signature path */
    #sig-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    #sig-path {
      fill: none;
      stroke: #d4af37;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px rgba(212,175,55,0.8));
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
    }

    /* ── HAND + PEN ── */
    #hand-wrap {
      position: absolute;
      right: -8%;
      bottom: 38%;
      width: 22%;
      opacity: 0;
      transform: translateX(30px);
      animation: handIn 0.6s 2.05s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes handIn { to { opacity: 1; transform: translateX(0); } }

    #hand-wrap.hand-exit {
      animation: handOut 0.5s cubic-bezier(0.4,0,1,1) forwards;
    }
    @keyframes handOut { to { opacity: 0; transform: translateX(40px) translateY(10px); } }

    #hand-svg { width: 100%; height: auto; }

    /* ── CHECKMARK ── */
    #checkmark-wrap {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    #checkmark-wrap.check-show {
      animation: checkIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes checkIn { to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

    #checkmark-wrap.check-hide {
      animation: checkOut 0.4s ease-in forwards;
    }
    @keyframes checkOut { to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } }

    .check-circle {
      width: clamp(60px, 8vw, 100px);
      height: clamp(60px, 8vw, 100px);
      border-radius: 50%;
      border: 3px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(212,175,55,0.08);
      box-shadow:
        0 0 20px rgba(212,175,55,0.6),
        0 0 50px rgba(212,175,55,0.25),
        inset 0 0 20px rgba(212,175,55,0.1);
      animation: checkGlow 1.5s ease-in-out infinite;
    }
    @keyframes checkGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(212,175,55,0.6), 0 0 50px rgba(212,175,55,0.25), inset 0 0 20px rgba(212,175,55,0.1); }
      50%       { box-shadow: 0 0 30px rgba(212,175,55,0.9), 0 0 70px rgba(212,175,55,0.4), inset 0 0 25px rgba(212,175,55,0.2); }
    }

    #check-svg { width: 55%; height: auto; }
    #check-path {
      fill: none;
      stroke: #d4af37;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      filter: drop-shadow(0 0 6px rgba(212,175,55,1));
    }
    #check-path.draw {
      animation: drawCheck 0.5s 0.1s ease-out forwards;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    /* ── PARTICLES ── */
    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── TYPEWRITER TEXT ── */
    #typewriter-wrap {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      width: 90%;
    }
    #typewriter-wrap.tw-show {
      opacity: 1;
    }
    #typewriter-wrap.tw-hide {
      animation: twFade 0.5s ease-in forwards;
    }
    @keyframes twFade { to { opacity: 0; } }

    #typewriter-text {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(14px, 2.2vw, 30px);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 20px rgba(212,175,55,0.4), 0 2px 8px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #d4af37;
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: cursorBlink 0.75s step-end infinite;
    }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── FADE OVERLAY (reset) ── */
    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #0a1628;
      opacity: 0;
      pointer-events: none;
    }
    #fade-overlay.fading {
      animation: fadeToBlack 0.7s ease-in forwards;
    }
    @keyframes fadeToBlack { to { opacity: 1; } }
  </style>
</head>
<body>
<div id="stage">

  <!-- Background canvas (floating particles + bg) -->
  <canvas id="bg-canvas"></canvas>

  <!-- Ambient glow -->
  <div id="ambient-glow"></div>

  <!-- Light rays -->
  <div id="rays"></div>

  <!-- Franchise document -->
  <div id="document-wrap">
    <div id="document">
      <div class="doc-logo">
        <div class="doc-logo-circle">
          <span class="doc-logo-inner">FA</span>
        </div>
        <div class="doc-title">Franchise<br>Agreement</div>
      </div>
      <div class="doc-lines">
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
      <div class="sig-zone">
        <div class="sig-label">Authorized Signature</div>
        <div class="sig-line-container">
          <svg id="sig-svg" viewBox="0 0 200 40" preserveAspectRatio="none">
            <path id="sig-path"
              d="M10,30 C20,10 30,35 45,28 C55,22 60,30 70,25 C82,19 88,32 100,26
                 C112,20 118,30 130,24 C140,19 145,28 158,22 C168,17 175,26 188,20"
            />
          </svg>
          <div class="sig-baseline"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hand holding pen (SVG silhouette) -->
  <div id="hand-wrap">
    <svg id="hand-svg" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Pen body -->
      <g transform="rotate(-35, 80, 100)">
        <!-- Pen barrel -->
        <rect x="68" y="20" width="14" height="90" rx="4" fill="#d4af37"/>
        <rect x="70" y="22" width="5" height="86" rx="2" fill="rgba(255,255,255,0.25)"/>
        <!-- Pen tip -->
        <polygon points="68,110 82,110 75,130" fill="#c8a020"/>
        <!-- Pen clip -->
        <rect x="78" y="24" width="3" height="60" rx="1.5" fill="#b8941a"/>
        <!-- Pen cap end -->
        <rect x="68" y="18" width="14" height="8" rx="3" fill="#b8941a"/>
        <!-- Ink nib shine -->
        <circle cx="75" cy="128" r="2" fill="rgba(212,175,55,0.8)"/>
        <circle cx="75" cy="128" r="4" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
      </g>
      <!-- Hand silhouette -->
      <g transform="translate(0, 50)">
        <!-- Palm -->
        <ellipse cx="78" cy="145" rx="38" ry="28" fill="#1a2d4a" stroke="rgba(212,175,55,0.3)" stroke-width="1.2"/>
        <!-- Fingers (simplified, holding pen) -->
        <!-- Index -->
        <path d="M55,130 C50,115 52,100 58,95 C62,92 66,95 66,102 L64,130 Z"
              fill="#1a2d4a" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
        <!-- Middle -->
        <path d="M68,128 C64,112 65,96 70,91 C74,88 78,91 78,99 L76,128 Z"
              fill="#1a2d4a" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
        <!-- Ring -->
        <path d="M80,130 C77,116 78,102 82,98 C86,95 90,98 90,105 L88,130 Z"
              fill="#1a2d4a" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
        <!-- Pinky -->
        <path d="M92,136 C89,124 90,114 94,110 C97,107 100,109 100,115 L98,136 Z"
              fill="#1a2d4a" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
        <!-- Thumb -->
        <path d="M44,145 C35,138 36,125 42,120 C47,116 52,120 52,128 L50,145 Z"
              fill="#1a2d4a" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>
        <!-- Knuckle highlights -->
        <ellipse cx="62" cy="130" rx="4" ry="2" fill="rgba(212,175,55,0.12)"/>
        <ellipse cx="75" cy="128" rx="4" ry="2" fill="rgba(212,175,55,0.12)"/>
        <ellipse cx="87" cy="129" rx="3" ry="2" fill="rgba(212,175,55,0.12)"/>
      </g>
    </svg>
  </div>

  <!-- Golden checkmark -->
  <div id="checkmark-wrap">
    <div class="check-circle">
      <svg id="check-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path id="check-path" d="M8,20 L17,30 L32,12"/>
      </svg>
    </div>
  </div>

  <!-- Particle canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Typewriter text -->
  <div id="typewriter-wrap">
    <span id="typewriter-text"></span><span class="cursor" id="cursor"></span>
  </div>

  <!-- Fade overlay for loop reset -->
  <div id="fade-overlay"></div>

</div>

<script>
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────────
  const stage      = document.getElementById('stage');
  const bgCanvas   = document.getElementById('bg-canvas');
  const bgCtx      = bgCanvas.getContext('2d');
  const pCanvas    = document.getElementById('particles-canvas');
  const pCtx       = pCanvas.getContext('2d');

  const handWrap   = document.getElementById('hand-wrap');
  const checkWrap  = document.getElementById('checkmark-wrap');
  const checkPath  = document.getElementById('check-path');
  const sigPath    = document.getElementById('sig-path');
  const twWrap     = document.getElementById('typewriter-wrap');
  const twText     = document.getElementById('typewriter-text');
  const cursor     = document.getElementById('cursor');
  const fadeOvl    = document.getElementById('fade-overlay');

  // ── Ray generation ───────────────────────────────────────────────────────
  const raysContainer = document.getElementById('rays');
  const RAY_COUNT = 14;
  for (let i = 0; i < RAY_COUNT; i++) {
    const r = document.createElement('div');
    r.className = 'ray';
    const angle  = (i / RAY_COUNT) * 360;
    const len    = 38 + Math.random() * 24;   // % of stage height
    const delay  = (i / RAY_COUNT) * 3;
    r.style.cssText = `
      height: ${len}vh;
      transform: rotate(${angle}deg) translateY(-50%);
      animation-delay: ${delay}s;
      opacity: ${0.3 + Math.random() * 0.4};
    `;
    raysContainer.appendChild(r);
  }

  // ── Canvas sizing ─────────────────────────────────────────────────────────
  function resizeCanvases() {
    const w = stage.offsetWidth;
    const h = stage.offsetHeight;
    bgCanvas.width  = w; bgCanvas.height  = h;
    pCanvas.width   = w; pCanvas.height   = h;
  }
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);

  // ── Background floating particles ────────────────────────────────────────
  const BG_PARTICLES = Array.from({ length: 55 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: 0.8 + Math.random() * 2,
    a: Math.random() * Math.PI * 2,
    speed: 0.00015 + Math.random() * 0.0002,
    opacity: 0.1 + Math.random() * 0.35,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.01 + Math.random() * 0.03,
  }));

  function drawBg(t) {
    const w = bgCanvas.width, h = bgCanvas.height;
    bgCtx.clearRect(0, 0, w, h);
    for (const p of BG_PARTICLES) {
      p.x += Math.cos(p.a) * p.speed;
      p.y += Math.sin(p.a) * p.speed;
      if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
      if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
      const tw = 0.5 + 0.5 * Math.sin(t * p.twinkleSpeed + p.twinklePhase);
      bgCtx.beginPath();
      bgCtx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(212,175,55,${p.opacity * tw})`;
      bgCtx.fill();
    }
  }

  // ── Burst particles ───────────────────────────────────────────────────────
  let burstParticles = [];

  function spawnBurst() {
    const w = pCanvas.width, h = pCanvas.height;
    const cx = w * 0.5, cy = h * 0.46;
    burstParticles = Array.from({ length: 22 }, (_, i) => {
      const angle = (i / 22) * Math.PI * 2 + Math.random() * 0.5;
      const speed = (3 + Math.random() * 5) * (w / 1280);
      return {
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: (2 + Math.random() * 3) * (w / 1280),
        life: 1,
        decay: 0.018 + Math.random() * 0.018,
        trail: [],
      };
    });
  }

  function drawBurst() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    burstParticles = burstParticles.filter(p => p.life > 0);
    for (const p of burstParticles) {
      p.trail.push({ x: p.x, y: p.y, life: p.life });
      if (p.trail.length > 6) p.trail.shift();
      // Draw trail
      for (let i = 0; i < p.trail.length - 1; i++) {
        const alpha = (p.trail[i].life / 1) * 0.3 * (i / p.trail.length);
        pCtx.beginPath();
        pCtx.moveTo(p.trail[i].x, p.trail[i].y);
        pCtx.lineTo(p.trail[i+1].x, p.trail[i+1].y);
        pCtx.strokeStyle = `rgba(212,175,55,${alpha})`;
        pCtx.lineWidth = p.r * 0.7;
        pCtx.stroke();
      }
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      pCtx.fillStyle = `rgba(212,175,55,${p.life * 0.9})`;
      pCtx.shadowColor = 'rgba(212,175,55,0.8)';
      pCtx.shadowBlur = 8;
      pCtx.fill();
      pCtx.shadowBlur = 0;
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.06;
      p.life -= p.decay;
    }
  }

  // ── Signature animation ───────────────────────────────────────────────────
  function animateSignature(duration) {
    const totalLen = sigPath.getTotalLength();
    sigPath.style.strokeDasharray  = totalLen;
    sigPath.style.strokeDashoffset = totalLen;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      // ease-in-out cubic
      const ease = progress < 0.5
        ? 4 * progress * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      sigPath.style.strokeDashoffset = totalLen * (1 - ease);
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ── Typewriter ────────────────────────────────────────────────────────────
  const TW_STRING = 'Step 1: Sign the Franchise Agreement';
  let twTimer = null;

  function startTypewriter(onDone) {
    twText.textContent = '';
    twWrap.classList.add('tw-show');
    cursor.style.display = 'inline-block';
    let i = 0;
    function type() {
      if (i < TW_STRING.length) {
        twText.textContent += TW_STRING[i++];
        twTimer = setTimeout(type, 52);
      } else {
        if (onDone) onDone();
      }
    }
    type();
  }

  function stopTypewriter() {
    clearTimeout(twTimer);
    twText.textContent = '';
  }

  // ── Main animation loop (state machine) ──────────────────────────────────
  const TOTAL_DURATION = 7200; // ms per cycle

  // Timings (ms)
  const T_DOC_IN       = 1000;
  const T_SIGN_START   = 2050;
  const T_SIGN_END     = 4000;
  const T_CHECK        = 4100;
  const T_BURST        = 4200;
  const T_TYPE_START   = 5000;
  const T_TYPE_END     = 6500;
  const T_FADE         = 6700;

  let cycleStart = null;
  let signTriggered   = false;
  let checkTriggered  = false;
  let burstTriggered  = false;
  let typeTriggered   = false;
  let fadeTriggered   = false;
  let resetting       = false;

  function resetCycle() {
    resetting = true;

    // Reset sig
    const totalLen = sigPath.getTotalLength();
    sigPath.style.strokeDasharray  = totalLen;
    sigPath.style.strokeDashoffset = totalLen;

    // Reset hand
    handWrap.classList.remove('hand-exit');
    handWrap.style.animation = 'none';
    void handWrap.offsetHeight; // reflow
    handWrap.style.opacity  = '0';
    handWrap.style.transform = 'translateX(30px)';

    // Reset doc
    const docWrap = document.getElementById('document-wrap');
    docWrap.style.animation = 'none';
    void docWrap.offsetHeight;
    docWrap.style.transform  = 'translate(-50%, 120%) scale(0.9)';
    docWrap.style.opacity    = '0';

    // Reset check
    checkWrap.classList.remove('check-show', 'check-hide');
    checkWrap.style.transform = 'translate(-50%, -50%) scale(0)';
    checkWrap.style.opacity   = '0';
    checkPath.classList.remove('draw');
    checkPath.style.strokeDashoffset = '60';

    // Reset typewriter
    stopTypewriter();
    twWrap.classList.remove('tw-show', 'tw-hide');
    cursor.style.display = 'none';

    // Reset burst
    burstParticles = [];

    // Remove fade
    fadeOvl.classList.remove('fading');
    fadeOvl.style.opacity = '0';

    // Reset flags
    signTriggered  = false;
    checkTriggered = false;
    burstTriggered = false;
    typeTriggered  = false;
    fadeTriggered  = false;
    resetting      = false;
    cycleStart     = null;
  }

  function restartAnimations() {
    // Re-trigger CSS animations by cloning trick
    const docWrap = document.getElementById('document-wrap');
    docWrap.style.animation = '';
    void docWrap.offsetHeight;

    handWrap.style.animation = '';
    void handWrap.offsetHeight;
  }

  let frameCount = 0;
  function mainLoop(ts) {
    if (resetting) { requestAnimationFrame(mainLoop); return; }

    if (!cycleStart) {
      cycleStart = ts;
      restartAnimations();
    }

    const elapsed = ts - cycleStart;
    drawBg(frameCount++);

    // Phase 3: Pen signing
    if (!signTriggered && elapsed >= T_SIGN_START) {
      signTriggered = true;
      animateSignature(T_SIGN_END - T_SIGN_START);
    }

    // Phase 3→4: Hand exit
    if (signTriggered && !checkTriggered && elapsed >= T_SIGN_END) {
      handWrap.classList.add('hand-exit');
    }

    // Phase 4: Checkmark
    if (!checkTriggered && elapsed >= T_CHECK) {
      checkTriggered = true;
      checkWrap.style.transform = '';
      checkWrap.style.opacity   = '';
      checkWrap.classList.add('check-show');
      // Draw check stroke
      setTimeout(() => checkPath.classList.add('draw'), 100);
    }

    // Phase 4: Particle burst
    if (!burstTriggered && elapsed >= T_BURST) {
      burstTriggered = true;
      spawnBurst();
    }
    if (burstTriggered) drawBurst();

    // Phase 5: Typewriter
    if (!typeTriggered && elapsed >= T_TYPE_START) {
      typeTriggered = true;
      startTypewriter();
    }

    // Phase 6: Fade out
    if (!fadeTriggered && elapsed >= T_FADE) {
      fadeTriggered = true;
      // Hide check & text
      checkWrap.classList.add('check-hide');
      twWrap.classList.add('tw-hide');
      fadeOvl.classList.add('fading');
    }

    // Restart cycle
    if (elapsed >= TOTAL_DURATION) {
      resetCycle();
    }

    requestAnimationFrame(mainLoop);
  }

  // Start animation loop
  requestAnimationFrame(mainLoop);
})();
</script>
</body>
</html>
