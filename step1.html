<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 1 — 10% Booking Amount</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Montserrat", sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ───── Floating Particles ───── */
    .particle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.3);
      animation: floatUp 6s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ───── Card ───── */
    .card {
      position: relative;
      width: 360px;
      padding: 48px 36px;
      border-radius: 28px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      text-align: center;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
    }

    .card.reveal {
      animation: slideUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glow ring behind card */
    .card::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 30px;
      background: linear-gradient(135deg, #38BDF8, #0ea5e9, transparent, #38BDF8);
      z-index: -1;
      opacity: 0;
      animation: glowSpin 3s linear infinite;
    }

    .card.reveal::before {
      opacity: 0.4;
    }

    @keyframes glowSpin {
      to { filter: hue-rotate(30deg); }
    }

    /* ───── Step Badge ───── */
    .step-badge {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 20px;
      border-radius: 20px;
      background: #38BDF8;
      color: #0f172a;
    }

    /* ───── Wallet Icon ───── */
    .icon-wrap {
      width: 96px;
      height: 96px;
      margin: 16px auto 24px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-wrap svg { width: 48px; height: 48px; }

    /* Ripple rings */
    .ripple {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      opacity: 0;
    }

    .ripple.animate {
      animation: rippleOut 1.6s ease-out forwards;
    }

    .ripple:nth-child(2).animate { animation-delay: 0.3s; }
    .ripple:nth-child(3).animate { animation-delay: 0.6s; }

    @keyframes rippleOut {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ───── Coin Rain ───── */
    .coin-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: 28px;
    }

    .coin {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: 2px solid #eab308;
      top: -30px;
      opacity: 0;
      font-size: 10px;
      font-weight: 800;
      color: #78350f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coin.drop {
      animation: coinDrop 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes coinDrop {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      20%  { opacity: 1; }
      70%  { transform: translateY(280px) rotate(360deg); opacity: 1; }
      85%  { transform: translateY(260px) rotate(380deg); opacity: 0.8; }
      100% { transform: translateY(300px) rotate(400deg); opacity: 0; }
    }

    /* ───── Percentage Counter ───── */
    .percentage {
      font-size: 72px;
      font-weight: 800;
      color: #38BDF8;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
      position: relative;
    }

    @keyframes counterPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .percentage.pop {
      animation: counterPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ───── Label ───── */
    .label {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      margin-bottom: 20px;
    }

    /* ───── Wallet Fill Bar ───── */
    .fill-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }

    .fill-bar-inner {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #38BDF8, #7dd3fc);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .fill-bar-inner.animate {
      width: 10%;
    }

    /* ───── Bottom Text ───── */
    .bottom-text {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 1s;
    }

    .bottom-text.visible { opacity: 1; }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particle" style="left:10%; animation-delay:0s; width:4px; height:4px;"></div>
  <div class="particle" style="left:25%; animation-delay:1.5s;"></div>
  <div class="particle" style="left:40%; animation-delay:3s; width:8px; height:8px;"></div>
  <div class="particle" style="left:60%; animation-delay:0.8s;"></div>
  <div class="particle" style="left:75%; animation-delay:2.2s; width:4px; height:4px;"></div>
  <div class="particle" style="left:90%; animation-delay:4s;"></div>

  <div class="card" id="card">
    <div class="step-badge">Step 1</div>

    <!-- Coin Rain -->
    <div class="coin-container" id="coinContainer"></div>

    <!-- Icon with Ripples -->
    <div class="icon-wrap">
      <div class="ripple" id="ripple1"></div>
      <div class="ripple" id="ripple2"></div>
      <div class="ripple" id="ripple3"></div>
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="8" width="30" height="22" rx="4" stroke="#38BDF8" stroke-width="2" fill="none" />
        <path d="M3 14h30" stroke="#38BDF8" stroke-width="2" />
        <rect id="walletFill" x="3" y="14" width="30" height="16" rx="0" fill="rgba(56,189,248,0.18)"
              style="clip-path: inset(100% 0 0 0); transition: clip-path 1.5s cubic-bezier(0.22,1,0.36,1);" />
        <circle cx="26" cy="22" r="2.5" fill="#38BDF8" />
        <path d="M10 8V6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2" stroke="#38BDF8" stroke-width="2" fill="none" />
      </svg>
    </div>

    <div class="percentage" id="counter">0%</div>
    <div class="label">Booking Amount</div>
    <div class="fill-bar">
      <div class="fill-bar-inner" id="fillBar"></div>
    </div>
    <div class="bottom-text" id="bottomText">First step to your dream product ✨</div>
  </div>

  <script>
    "use strict";

    function animateCounter(el, target, duration) {
      var start = performance.now();
      function tick(now) {
        var elapsed = now - start;
        var progress = Math.min(elapsed / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target) + "%";
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = target + "%";
          el.classList.add("pop");
          el.addEventListener("animationend", function handler() {
            el.classList.remove("pop");
            el.removeEventListener("animationend", handler);
          });
        }
      }
      requestAnimationFrame(tick);
    }

    function dropCoins() {
      var container = document.getElementById("coinContainer");
      var positions = [15, 30, 50, 65, 80];
      positions.forEach(function (left, i) {
        setTimeout(function () {
          var coin = document.createElement("div");
          coin.className = "coin";
          coin.textContent = "₹";
          coin.style.left = left + "%";
          container.appendChild(coin);
          requestAnimationFrame(function () { coin.classList.add("drop"); });
          setTimeout(function () { coin.remove(); }, 1300);
        }, i * 200);
      });
    }

    window.addEventListener("DOMContentLoaded", function () {
      setTimeout(function () {
        var card = document.getElementById("card");
        card.classList.add("reveal");

        setTimeout(function () {
          /* Ripple rings */
          document.getElementById("ripple1").classList.add("animate");
          document.getElementById("ripple2").classList.add("animate");
          document.getElementById("ripple3").classList.add("animate");

          /* Wallet fill */
          document.getElementById("walletFill").style.clipPath = "inset(0 0 0 0)";

          /* Counter */
          animateCounter(document.getElementById("counter"), 10, 1800);

          /* Fill bar */
          document.getElementById("fillBar").classList.add("animate");

          /* Coin rain */
          setTimeout(dropCoins, 400);

          /* Bottom text */
          setTimeout(function () {
            document.getElementById("bottomText").classList.add("visible");
          }, 2000);
        }, 800);
      }, 500);
    });
  </script>
</body>
</html>
